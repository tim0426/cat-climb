<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cat Climb — Hand-in</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e18; color: #e8ecf4; line-height: 1.45;
      padding: 24px 16px 48px;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: #9aa3b5; margin-bottom: 28px; }
    .card {
      background: #121826; border: 1px solid #243049; border-radius: 14px;
      padding: 18px 16px; margin-bottom: 14px;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
    .card p { margin: 0 0 12px; color: #c5cce0; font-size: 0.95rem; }
    a.btn {
      display: inline-block; background: #3b82f6; color: #fff; text-decoration: none;
      padding: 12px 18px; border-radius: 10px; font-weight: 600;
    }
    a.btn.secondary { background: #243049; }
    a.btn + a.btn { margin-left: 8px; }
    video, iframe, embed, object {
      width: 100%; max-height: 70vh; border-radius: 10px; background: #000;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Cat Climb</h1>
    <p class="sub">HDAT2102 hand-in portal — phone / iPad / PC 都開到</p>

    <section class="card" id="game">
      <h2>A / C · Play the game</h2>
      <p>網頁即玩，唔使解壓。空白鍵或點擊跳牆。</p>
      <div class="row">
        <a class="btn" href="index.html">▶ 開始玩</a>
      </div>
    </section>

    <section class="card" id="video">
      <h2>A · Gameplay video (MP4)</h2>
      <p>30–60s demo。如果下面播唔到，撳下載。</p>
      <video controls playsinline preload="metadata" src="media/cat-climb-demo.mp4">
        Your browser cannot play this video.
      </video>
      <p style="margin-top:12px">
        <a class="btn secondary" href="media/cat-climb-demo.mp4" download>下載 MP4</a>
      </p>
    </section>

    <section class="card" id="proposal">
      <h2>B · Design Proposal</h2>
      <p>PDF 可直接睇或下載。</p>
      <div class="row" style="margin-bottom:12px">
        <a class="btn" href="proposal/CatClimb-Design-Proposal.pdf" target="_blank" rel="noopener">打開 Proposal PDF</a>
        <a class="btn secondary" href="proposal/CatClimb-Design-Proposal.pdf" download>下載 PDF</a>
      </div>
      <iframe title="Design Proposal" src="proposal/CatClimb-Design-Proposal.pdf#view=FitH" style="height:70vh;border:0;width:100%;border-radius:10px;background:#111"></iframe>
    </section>
  </main>
</body>
</html>
